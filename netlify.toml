[build]
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

# Static assets (splats, GLBs) are large; keep them cached.
[[headers]]
  for = "/*.spz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
